<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频解析|Region的影视厅</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }
        .box {
            max-width: 760px;
            margin: 48px auto;
            padding: 28px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        h1 { font-size: 22px; margin: 0 0 6px; }
        p.tip { color: #888; font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        input[type=text] {
            flex: 1; min-width: 240px; padding: 11px 12px;
            border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
        }
        select {
            padding: 11px; border: 1px solid #ccc; border-radius: 6px;
            font-size: 14px; background: #fff;
        }
        button {
            padding: 11px 20px; border: 0; border-radius: 6px;
            background: #e74c3c; color: #fff; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #c0392b; }
        #player { margin-top: 18px; display: none; }
        #player iframe {
            width: 100%; height: 70vh; border: 0; border-radius: 8px; background: #000;
        }
        .back {
            margin-top: 10px; display: inline-block; background: #666;
        }
        .back:hover { background: #555; }
    </style>
</head>
<body>
    <div class="box">
        <h1>视频解析播放</h1>
        <p class="tip">
            粘贴视频播放页链接或 .m3u8 直链，选择解析接口后点击「解析播放」。
            解析由第三方接口提供；若某个接口失效，请换一个接口重试。
            也可通过 <code>?url=视频地址</code> 直接打开本页进行解析。
        </p>
        <div class="row">
            <input id="url" type="text" placeholder="https://..." />
            <select id="api">
                <option value="https://jx.77flv.cc/?url=">接口一 (77flv)</option>
                <option value="https://z1.m1907.top/?jx=">接口二 (m1907)</option>
                <option value="https://jx.aidouer.net/?url=">接口三 (aidouer)</option>
            </select>
            <button id="play">解析播放</button>
        </div>
        <div id="player">
            <iframe id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
            <button class="back" id="back">返回 / 换接口</button>
        </div>
    </div>
    <script>
        function g(n) {
            var m = window.location.search.substr(1).match(new RegExp("(^|&)" + n + "=([^&]*)(&|$)", "i"));
            return m ? decodeURIComponent(m[2]) : "";
        }
        var urlEl = document.getElementById('url');
        var apiEl = document.getElementById('api');
        var player = document.getElementById('player');
        var frame = document.getElementById('frame');

        function play(u, api) {
            frame.src = api + encodeURIComponent(u);
            player.style.display = 'block';
            window.scrollTo({ top: player.offsetTop, behavior: 'smooth' });
        }

        document.getElementById('play').onclick = function () {
            var u = urlEl.value.trim();
            if (!u) { alert('请先粘贴视频链接'); return; }
            play(u, apiEl.value);
        };
        document.getElementById('back').onclick = function () {
            frame.src = '';
            player.style.display = 'none';
        };

        // 支持通过 ?url= 直接打开
        var q = g('url');
        if (q) { urlEl.value = q; play(q, apiEl.value); }
    </script>
</body>
</html>
