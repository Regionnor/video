<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频解析|Region的影视厅</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; background: #f4f4f4; color: #333; }
        .box { max-width: 820px; margin: 48px auto; padding: 28px; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(80,90,160,0.15); }
        h1 { font-size: 24px; margin: 0 0 6px; background: linear-gradient(135deg,#7b5cff 0%,#4a8cff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; }
        p.tip { color: #888; font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        input[type=text] { flex: 1; min-width: 240px; padding: 11px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 11px 20px; border: 0; border-radius: 6px; background: #e74c3c; color: #fff; font-size: 14px; cursor: pointer; }
        button:hover { background: #c0392b; }
        #player { margin-top: 18px; display: none; }
        #player video { width: 100%; height: 70vh; background: #000; border-radius: 8px; }
        .back { margin-top: 10px; display: inline-block; background: #666; }
        .back:hover { background: #555; }
        #msg { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }
        code { background: #eee; padding: 1px 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔗 视频解析播放</h1>
        <p class="tip">
            直接粘贴 <code>.m3u8</code> 直链即可播放（推荐）。也可粘贴视频播放页链接，本页会尝试通过解析接口加载。<br>
            本站已改用自托管的 HLS 播放器，不再依赖容易失效的第三方解析接口；个别无跨域许可的源会自动走本站代理。
        </p>
        <div class="row">
            <input id="url" type="text" placeholder="https://.../index.m3u8 或视频播放页链接" />
            <button id="play">播放</button>
        </div>
        <div id="msg"></div>
        <div id="player">
            <video id="v" controls autoplay playsinline></video>
            <button class="back" id="back">返回 / 换链接</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script>
        function g(n) {
            var m = window.location.search.substr(1).match(new RegExp("(^|&)" + n + "=([^&]*)(&|$)", "i"));
            return m ? decodeURIComponent(m[2]) : "";
        }
        var urlEl = document.getElementById('url');
        var player = document.getElementById('player');
        var video = document.getElementById('v');
        var msg = document.getElementById('msg');

        function showMsg(t) { msg.textContent = t; msg.style.display = 'block'; }
        function clearMsg() { msg.style.display = 'none'; }

        function playUrl(raw, useProxy) {
            if (!raw) return;
            var url = useProxy ? "/api/hls?url=" + encodeURIComponent(raw) : raw;
            if (window.Hls && Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () { video.play().catch(function () {}); });
                hls.on(Hls.Events.ERROR, function (e, d) {
                    if (!d.fatal) return;
                    if (!useProxy) { try { hls.destroy(); } catch (x) {} playUrl(raw, true); }
                    else { showMsg('加载失败：链接可能已失效，或不是可播放的视频源。'); }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(function () {});
                video.addEventListener('error', function () { if (!useProxy) playUrl(raw, true); else showMsg('加载失败：链接可能已失效。'); });
            } else {
                showMsg('当前浏览器不支持 HLS 播放。');
            }
        }

        document.getElementById('play').onclick = function () {
            var u = urlEl.value.trim();
            if (!u) { showMsg('请先粘贴视频链接。'); return; }
            clearMsg();
            player.style.display = 'block';
            playUrl(u, false);
        };
        document.getElementById('back').onclick = function () {
            video.pause(); video.removeAttribute('src'); video.load();
            player.style.display = 'none';
        };

        var q = g('url');
        if (q) { urlEl.value = q; document.getElementById('play').onclick(); }
    </script>
</body>
</html>
